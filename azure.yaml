# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Foundry hosted-agent project (ADR-0009): `azd provision` runs infra/ Bicep;
# `azd deploy` (azure.ai.agents extension) zips src/, remote-builds, creates the
# agent version, and wires the platform-created Entra Agent ID's RBAC.
name: memory-first-agent

requiredVersions:
  extensions:
    azure.ai.agents: ">=0.1.0-preview"

services:
  ai-project:
    host: azure.ai.project
    # Provisioned by infra/ Bicep (account, project, model deployments); azd
    # connects to it rather than synthesizing one. Output of `azd provision`.
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}

  # Service key doubles as the cloud agent name for `azd ai agent` commands
  # (the extension resolves invoke/show targets by service key, not `name`).
  memory-first-agent:
    host: azure.ai.agent
    kind: hosted
    name: memory-first-agent
    description: >-
      Memory-first web agent: two-tier Redis vector memory with live-web
      fallback and cited answers.
    project: src
    uses:
      - ai-project
    codeConfiguration:
      runtime: python_3_14
      # azd expects a string here (the runtime supplies the interpreter);
      # the SDK's ["python", "main.py"] array form is rejected by the extension.
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    # ${VAR} values resolve from the azd environment: endpoints come from Bicep
    # outputs; secrets are loaded from Key Vault by the deploy pipeline (never
    # stored in the repo). FOUNDRY_PROJECT_ENDPOINT is injected by the platform
    # and deliberately not declared here.
    env:
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      CHAT_DEPLOYMENT: gpt-5.6-luna
      UTILITY_DEPLOYMENT: gpt-5-nano
      EMBED_DEPLOYMENT: text-embedding-3-small
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      REDIS_URL: ${REDIS_URL}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}

infra:
  provider: bicep
  path: ./infra
