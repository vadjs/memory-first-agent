name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write # OIDC federation — no long-lived cloud secrets in GitHub
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/setup-azd@v2
      - name: Install Foundry agent extension
        run: azd ext install azure.ai.agents # runner images don't bundle it
      - name: Log in with azd (federated credentials)
        run: >
          azd auth login
          --client-id "$AZURE_CLIENT_ID"
          --federated-credential-provider "github"
          --tenant-id "$AZURE_TENANT_ID"
      - name: Log in with az (Key Vault reads)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision (idempotent)
        run: azd provision --no-prompt
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Load agent secrets from Key Vault into azd env
        # Key Vault is the secret source of truth (ADR-0009): Bicep writes the
        # generated Redis URL, model key, and Tavily seed there at provision;
        # this step feeds them to the ${VAR} references in azure.yaml's env map.
        run: |
          kv="$(azd env get-value AZURE_KEY_VAULT_NAME)"
          for pair in REDIS_URL:redis-url TAVILY_API_KEY:tavily-api-key AZURE_OPENAI_API_KEY:azure-openai-api-key; do
            var="${pair%%:*}" secret="${pair#*:}"
            value="$(az keyvault secret show --vault-name "$kv" --name "$secret" --query value -o tsv)"
            echo "::add-mask::$value"
            azd env set "$var" "$value"
          done
      - name: Deploy hosted agent (zip → remote build → new version)
        run: azd deploy --no-prompt
      - uses: astral-sh/setup-uv@v5
      - name: Enable incoming A2A (agent card + protocol bridge)
        # azd deploy resets endpoint protocol configuration, so this re-applies
        # the A2A bridge and agent card after every deploy (ADR-0010).
        run: |
          export FOUNDRY_PROJECT_ENDPOINT="$(azd env get-value FOUNDRY_PROJECT_ENDPOINT)"
          uv run --frozen --no-dev python scripts/enable_a2a.py
      - name: Smoke-invoke the deployed agent
        run: >
          azd ai agent invoke memory-first-agent
          "What is the strangler fig pattern in software architecture?"
          --no-prompt --output raw
