[project]
name = "agent"
version = "0.1.0"
description = "Memory-first web agent: answers from Redis vector memory, falls back to the web"
authors = [
    { name = "Vadim Zhamkov", email = "vadim.zhamkov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agent-framework>=1.13.0",
    "azure-identity>=1.26.0b2",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "pydantic-settings>=2.15.0",
    "redis>=7.1.1",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "tavily-python>=0.7.27",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "trafilatura>=2.2.0",
    "typer>=0.27.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
markers = [
    "external: needs live Azure/Tavily credentials and network",
    "redis: needs a running Redis (docker compose up -d redis)",
]
